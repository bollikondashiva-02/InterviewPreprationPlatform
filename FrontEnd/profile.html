<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>My Profile - PrepConnect</title>

<link rel="stylesheet"
      href="css/profile.css">


</head>

<body>


<div class="profile-container">

    <h1>My Profile</h1>

    <p class="subtitle">
        View your PrepConnect account details
    </p>

    <div class="profile-card">

        <div class="profile-row">
            <span>ID</span>
            <strong id="userId">Loading...</strong>
        </div>

        <div class="profile-row">
            <span>Name</span>
            <strong id="userName">Loading...</strong>
        </div>

        <div class="profile-row">
            <span>Email</span>
            <strong id="userEmail">Loading...</strong>
        </div>

        <div class="profile-row">
            <span>Role</span>
            <strong id="userRole">Loading...</strong>
        </div>

        <div class="profile-row">
            <span>Email Verified</span>
            <strong id="userVerified">Loading...</strong>
        </div>

    </div>

    <p id="message"></p>

    <a href="dashboard.html">
        Back to Dashboard
    </a>

</div>

<script src="js/config.js"></script>
<script src="js/profile.js"></script>


</body>

</html>
